<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Pedidos · Aguanile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#0A2A66;--azul2:#123C8F;--turq:#2ED3C6;--turq2:#1BB8AC;--naranja:#F26A1B;
  --gris:#6B7A90;--linea:#E6ECF5;--sh:0 10px 30px rgba(10,42,102,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F4F7FC;color:#12203A;
  font-family:'Montserrat',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px}
.hide{display:none!important}
.ico{display:inline-block;vertical-align:middle;flex-shrink:0}

/* LOGO BLANCO en header del panel y en login lo dejamos azul
   (login card es blanca, header es azul) */
.head-logo{
  filter: brightness(0) invert(1) drop-shadow(0 4px 14px rgba(0,0,0,.35));
}

/* LOGIN */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(160deg,#071B44,#0A2A66 50%,#123C8F)}
.login-card{background:#fff;border-radius:24px;padding:38px 30px 32px;width:min(420px,100%);
  box-shadow:0 30px 70px rgba(0,0,0,.4);text-align:center;color:#12203A}
.login-logo{height:96px;width:auto;margin:0 auto 18px;display:block}
.login-card h1{margin:0 0 6px;font-size:20px;font-weight:900;color:var(--azul);letter-spacing:-.4px}
.login-card p{margin:0 0 24px;color:var(--gris);font-size:13px;line-height:1.5}
.pin-wrap{position:relative;margin-bottom:14px}
.pin-wrap input{width:100%;padding:16px 44px 16px 16px;border:2px solid var(--linea);border-radius:14px;
  text-align:center;font-size:22px;letter-spacing:10px;font-weight:800;outline:0;
  color:var(--azul);background:#fff;transition:.2s;font-family:inherit}
.pin-wrap input::placeholder{color:#C8D2E0;letter-spacing:10px}
.pin-wrap input:focus{border-color:var(--turq);box-shadow:0 0 0 4px rgba(46,211,198,.15)}
.pin-wrap .toggle-eye{position:absolute;top:50%;right:14px;transform:translateY(-50%);
  color:var(--gris);cursor:pointer;padding:4px;display:grid;place-items:center}
.login-card button.primary{width:100%;padding:16px;border-radius:14px;
  background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;
  font-weight:900;font-size:15px;letter-spacing:.3px;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:9px}
.login-card button.primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(10,42,102,.35)}
.login-card button.primary:disabled{opacity:.6;cursor:wait;transform:none}
.login-err{margin-top:14px;font-size:12.5px;color:#B00020;font-weight:700;
  padding:10px 14px;background:#FCE4E4;border-radius:10px;display:none;
  align-items:center;justify-content:center;gap:8px}
.login-err.on{display:flex}
.login-hint{display:block;margin-top:20px;font-size:11px;color:var(--gris);
  padding-top:16px;border-top:1px solid var(--linea)}
.login-hint b{color:var(--naranja);font-weight:900}

/* PANEL */
.panel{max-width:1280px;margin:0 auto;padding:0 16px 60px}
header.panel-head{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;
  padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  box-shadow:0 8px 24px rgba(10,42,102,.2)}
.head-logo{height:52px;width:auto}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
  padding:8px 14px;border-radius:12px;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;color:#DCE9FF}
.stat b{font-size:16px;font-weight:900;color:var(--turq)}
.btn-h{background:var(--naranja);color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;
  font-size:12.5px;transition:.2s;display:inline-flex;align-items:center;gap:7px}
.btn-h:hover{background:#FF8A3D;transform:translateY(-1px)}
.btn-h.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.btn-h.ghost:hover{background:rgba(255,255,255,.24)}

.toolbar{padding:20px 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar .search{padding:11px 16px;border:2px solid var(--linea);border-radius:12px;
  background:#fff;font-weight:700;color:var(--azul);outline:0}
.toolbar .search{flex:1;min-width:200px;font-weight:500}
.toolbar select:focus,.toolbar .search:focus{border-color:var(--turq)}
.auto{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--gris);cursor:pointer}
.auto input{width:16px;height:16px;accent-color:var(--turq);cursor:pointer}

.orders{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media(max-width:600px){.orders{grid-template-columns:1fr}}
.order{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh);
  border-left:5px solid var(--gris);display:flex;flex-direction:column;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.order.estado-Pendiente{border-left-color:var(--naranja)}
.order.estado-Preparando{border-left-color:#F5A623}
.order.estado-Listo{border-left-color:var(--turq)}
.order.estado-Entregado{border-left-color:#2E7D32;opacity:.72}
.order.estado-Cancelado{border-left-color:#B00020;opacity:.55}
.order-head{padding:14px 16px;background:#F7FAFF;border-bottom:1px solid var(--linea);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.order-head h3{margin:0;font-size:16px;font-weight:900;color:var(--azul);
  display:flex;align-items:center;gap:8px}
.order-head .modo{font-size:11.5px;color:var(--gris);font-weight:700;margin-top:5px;
  display:flex;align-items:center;gap:6px}
.order-head .fecha{font-size:10.5px;color:var(--gris);text-align:right;line-height:1.4}
.estado-tag{padding:5px 11px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.6px;
  text-transform:uppercase;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.estado-tag.Pendiente{background:#FFF0E0;color:var(--naranja)}
.estado-tag.Preparando{background:#FFF6DD;color:#8A6400}
.estado-tag.Listo{background:#E0FAF7;color:var(--turq2)}
.estado-tag.Entregado{background:#E5F4E5;color:#2E7D32}
.estado-tag.Cancelado{background:#FCE4E4;color:#B00020}
.order-body{padding:14px 16px;flex:1}
.cliente{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;font-size:12.5px;color:var(--gris)}
.cliente b{color:var(--azul);font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:3px}
.cliente .fila{display:flex;gap:7px;align-items:flex-start}
.items{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.items li{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;
  border-bottom:1px dashed var(--linea);align-items:flex-start;gap:10px}
.items li b{color:var(--azul);font-weight:900}
.items .nota{font-size:11px;color:var(--naranja);font-style:italic;padding-left:14px;margin-bottom:5px}
.totales{background:#F7FAFF;border-radius:12px;padding:11px 13px;margin-bottom:12px}
.totales .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--gris);font-weight:600;margin-bottom:4px}
.totales .r.big{font-size:16px;color:var(--azul);font-weight:900;margin:7px 0 0;padding-top:7px;
  border-top:2px dashed var(--linea)}
.order-actions{padding:12px 16px;background:#F7FAFF;border-top:1px solid var(--linea);
  display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.order-actions button,.order-actions a{padding:9px 13px;border-radius:10px;font-size:12px;font-weight:800;
  transition:.2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;cursor:pointer}
.order-actions .primary{background:var(--azul);color:#fff;flex:1;justify-content:center}
.order-actions .primary:hover{background:var(--azul2)}
.order-actions .wa{background:#25D366;color:#fff}
.order-actions .wa:hover{background:#1DAF54}
.order-actions .ok{background:#2E7D32;color:#fff}
.order-actions .ok:hover{background:#256428}
.order-actions .cancel{background:#FCE4E4;color:#B00020}
.order-actions .cancel:hover{background:#F8C9C9}
.empty{text-align:center;padding:80px 20px;color:var(--gris)}
.empty .big{color:#C8D2E0}
.empty h3{color:var(--azul);margin:14px 0 6px}
.loading{text-align:center;padding:60px;color:var(--gris);font-weight:600}
.spinner{width:34px;height:34px;border:4px solid var(--linea);border-top-color:var(--turq);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,120px);z-index:200;
  background:var(--azul);color:#fff;padding:14px 24px;border-radius:999px;font-weight:700;font-size:13.5px;
  box-shadow:0 16px 40px rgba(10,42,102,.45);transition:.35s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;display:flex;align-items:center;gap:10px;max-width:92vw}
.toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="login-card">
    <img class="login-logo" src="assets/logo.png" alt="Aguanile" onerror="this.style.display='none'">
    <h1>Panel de Pedidos</h1>
    <p>Ingresa el PIN de empleados para ver los pedidos pendientes.</p>
    <div class="pin-wrap">
      <input type="password" id="pinInput" maxlength="6" inputmode="numeric"
             placeholder="••••" autocomplete="off" aria-label="PIN">
      <span class="toggle-eye" id="toggleEye" title="Mostrar PIN"></span>
    </div>
    <button class="primary" id="pinBtn" type="button">Entrar al panel</button>
    <div class="login-err" id="loginErr"></div>
    <small class="login-hint">PIN por defecto: <b>1234</b> · Cámbialo en <code>CONFIG.pin</code></small>
  </div>
</div>

<!-- PANEL -->
<div id="panelView" class="hide">
  <header class="panel-head">
    <img class="head-logo" src="assets/logo.png" alt="Aguanile">
    <div class="stats">
      <div class="stat" id="st1"></div>
      <div class="stat" id="st2"></div>
      <div class="stat" id="st3"></div>
      <div class="stat" id="st4"></div>
    </div>
    <button class="btn-h ghost" id="refreshBtn" type="button"></button>
    <button class="btn-h" id="logoutBtn" type="button"></button>
  </header>

  <main class="panel">
    <div class="toolbar">
      <select id="filterEstado">
        <option value="todos">Todos los estados</option>
        <option value="Pendiente" selected>Solo Pendientes</option>
        <option value="Preparando">Preparando</option>
        <option value="Listo">Listos</option>
        <option value="Entregado">Entregados</option>
        <option value="Cancelado">Cancelados</option>
      </select>
      <input class="search" id="searchInput" placeholder="Buscar folio, cliente o teléfono…">
      <label class="auto"><input type="checkbox" id="autoRefresh" checked> Auto-actualizar (30s)</label>
    </div>
    <div id="ordersContainer" class="orders"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURACIÓN — tu URL real + PIN permanente
   ========================================================= */
const CONFIG = {
  sheetUrl: 'https://script.google.com/macros/s/AKfycbza15kGOsoJsWNAhya72AVxPxFljo_R4By8LC7iSiBdF_51h1-GBk-BF1cuuidc_vHK/exec',
  pin: '1234',
  autoRefreshMs: 30000
};

/* =========================================================
   ICONOS SVG
   ========================================================= */
const I = {
  check:'<path d="M20 6 9 17l-5-5"/>',
  checkCircle:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  xCircle:'<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/>',
  phone:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>',
  message:'<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  pan:'<path d="M3 11h18"/><path d="M6 11V7a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  scooter:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6"/><path d="M6 14V6a2 2 0 0 1 2-2h4l3 6"/><path d="M13 10h5a1 1 0 0 1 1 1v6"/>',
  utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  dollar:'<line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  clipboard:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>'
};
function ico(n, s){ s = s || 20; return I[n] ? '<svg class="ico" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>' : ''; }

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const money = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2}).format(n||0);
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, iconName){
  const t = $('#toast');
  t.innerHTML = (iconName ? ico(iconName,20) : '') + '<span>'+esc(msg)+'</span>';
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* =========================================================
   AUTENTICACIÓN PERMANENTE — el PIN NUNCA caduca
   ========================================================= */
const AUTH_KEY = 'aguanile_admin_auth_v3';

function isAuthed(){
  try{
    return localStorage.getItem(AUTH_KEY) === '1';
  }catch(e){ return false; }
}
function setAuth(v){
  try{
    if(v) localStorage.setItem(AUTH_KEY, '1');
    else localStorage.removeItem(AUTH_KEY);
  }catch(e){}
}

/* ---------- Login ---------- */
const pinInput   = $('#pinInput');
const pinBtn     = $('#pinBtn');
const loginErr   = $('#loginErr');
const toggleEye  = $('#toggleEye');

toggleEye.innerHTML = ico('eye', 20);
toggleEye.addEventListener('click', () => {
  const isPwd = pinInput.type === 'password';
  pinInput.type = isPwd ? 'text' : 'password';
  toggleEye.innerHTML = isPwd ? ico('eyeOff',20) : ico('eye',20);
});

function showError(msg){
  loginErr.innerHTML = ico('xCircle',16) + ' <span>'+esc(msg)+'</span>';
  loginErr.classList.add('on');
  setTimeout(()=>loginErr.classList.remove('on'), 3200);
}

function tryLogin(){
  const val = (pinInput.value || '').trim();
  if(!val){ showError('Ingresa el PIN'); pinInput.focus(); return; }
  if(val === CONFIG.pin){
    setAuth(true);
    showPanel();
  } else {
    showError('PIN incorrecto. Intenta de nuevo.');
    pinInput.value = '';
    pinInput.focus();
  }
}
pinBtn.addEventListener('click', tryLogin);
pinInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); tryLogin(); }
});

$('#logoutBtn').addEventListener('click', () => {
  if(!confirm('¿Cerrar sesión del panel?')) return;
  setAuth(false);
  location.reload();
});

/* =========================================================
   JSONP para leer pedidos
   ========================================================= */
let _jp = 0;
function fetchOrders(){
  return new Promise((resolve, reject) => {
    const cb = 'aguanile_cb_' + (++_jp);
    window[cb] = data => {
      delete window[cb];
      const s = document.getElementById(cb);
      if(s) s.remove();
      resolve(data || []);
    };
    const s = document.createElement('script');
    s.id = cb;
    s.src = CONFIG.sheetUrl + '?action=orders&callback=' + cb + '&_=' + Date.now();
    s.onerror = () => { delete window[cb]; reject(new Error('Error de red')); };
    document.body.appendChild(s);
    setTimeout(() => {
      if(window[cb]){
        delete window[cb];
        const el = document.getElementById(cb);
        if(el) el.remove();
        reject(new Error('Timeout'));
      }
    }, 12000);
  });
}

let ALL_ORDERS = [];
function normalizeOrder(row){
  let items = [];
  try{ items = JSON.parse(row[10] || '[]'); }catch(e){}
  return {
    ts: row[0], folio: row[1], modo: row[2], cliente: row[3], telefono: row[4],
    direccion: row[5], referencias: row[6], mesa: row[7], hora: row[8], notas: row[9],
    items, subtotal:+row[11]||0, envio:+row[12]||0, propina:+row[13]||0, total:+row[14]||0,
    estado: row[15] || 'Pendiente'
  };
}
const ESTADO_ICON = {Pendiente:'clock', Preparando:'pan', Listo:'checkCircle', Entregado:'bag', Cancelado:'xCircle'};

function renderOrders(){
  const ef = $('#filterEstado').value;
  const q = $('#searchInput').value.trim().toLowerCase();
  let list = ALL_ORDERS.map(normalizeOrder);
  if(ef !== 'todos') list = list.filter(o => o.estado === ef);
  if(q) list = list.filter(o =>
    (o.folio||'').toLowerCase().includes(q) ||
    (o.cliente||'').toLowerCase().includes(q) ||
    (o.telefono||'').toLowerCase().includes(q)
  );
  list.sort((a,b) => new Date(b.ts) - new Date(a.ts));

  const all = ALL_ORDERS.map(normalizeOrder);
  $('#st1').innerHTML = ico('clock',16) + ' Pendientes <b>' + all.filter(o=>o.estado==='Pendiente').length + '</b>';
  $('#st2').innerHTML = ico('pan',16)   + ' Preparando <b>' + all.filter(o=>o.estado==='Preparando').length + '</b>';
  $('#st3').innerHTML = ico('checkCircle',16) + ' Listos <b>' + all.filter(o=>o.estado==='Listo').length + '</b>';
  const hoy = new Date().toDateString();
  $('#st4').innerHTML = ico('dollar',16) + ' Hoy <b>' +
    money(all.filter(o => new Date(o.ts).toDateString() === hoy).reduce((s,o)=>s+o.total,0)) + '</b>';

  const cont = $('#ordersContainer');
  if(!list.length){
    cont.innerHTML = '<div class="empty" style="grid-column:1/-1">'
      + '<div class="big">'+ico('clipboard',72)+'</div>'
      + '<h3>No hay pedidos</h3>'
      + '<p>Los pedidos nuevos aparecerán aquí automáticamente.</p></div>';
    return;
  }
  cont.innerHTML = list.map(renderOrderCard).join('');
}
function renderOrderCard(o){
  const fecha = o.ts ? new Date(o.ts).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}) : '—';
  const itemsHtml = (o.items||[]).map(it =>
    '<li><span><b>'+it.cantidad+'× '+esc(it.nombre)+(it.variante?' <span style="color:var(--turq2)">('+esc(it.variante)+')</span>':'')+'</b>'
    + (it.nota ? '<div class="nota">'+esc(it.nota)+'</div>' : '')+'</span>'
    + '<span style="white-space:nowrap">'+money(it.importe)+'</span></li>'
  ).join('');
  const modoIcon = o.modo === 'A domicilio' ? 'scooter' : o.modo === 'Para llevar' ? 'bag' : 'utensils';
  const waText = encodeURIComponent('Hola '+o.cliente+', tu pedido '+o.folio+' está en camino. ¡Gracias!');
  return '<article class="order estado-'+o.estado+'" data-folio="'+esc(o.folio)+'">'
    + '<div class="order-head">'
      + '<div>'
        + '<h3>'+ico('clipboard',16)+' '+esc(o.folio)+'</h3>'
        + '<div class="modo">'+ico(modoIcon,13)+' '+esc(o.modo||'—')
          + (o.mesa?' · Mesa '+esc(o.mesa):'') + (o.hora?' · '+esc(o.hora):'')+'</div>'
        + '<span class="estado-tag '+o.estado+'">'+ico(ESTADO_ICON[o.estado]||'clock',12)+' '+esc(o.estado)+'</span>'
      + '</div>'
      + '<div class="fecha">'+fecha+'</div>'
    + '</div>'
    + '<div class="order-body">'
      + '<div class="cliente">'
        + '<b>'+ico('user',14)+' '+esc(o.cliente||'Cliente')+'</b>'
        + (o.telefono ? '<div class="fila">'+ico('phone',12)+' '+esc(o.telefono)+'</div>' : '')
        + (o.direccion ? '<div class="fila">'+ico('pin',12)+' '+esc(o.direccion)+'</div>' : '')
        + (o.referencias ? '<div class="fila">'+ico('pin',12)+' '+esc(o.referencias)+'</div>' : '')
      + '</div>'
      + '<ul class="items">'+itemsHtml+'</ul>'
      + '<div class="totales">'
        + '<div class="r"><span>Subtotal</span><span>'+money(o.subtotal)+'</span></div>'
        + (o.envio>0 ? '<div class="r"><span>Envío</span><span>'+money(o.envio)+'</span></div>' : '')
        + '<div class="r big"><span>Total</span><span>'+money(o.total)+'</span></div>'
      + '</div>'
    + '</div>'
    + '<div class="order-actions">'
      + (o.estado === 'Pendiente'  ? '<button class="primary" data-estado="Preparando" type="button">'+ico('pan',14)+' Preparar</button>' : '')
      + (o.estado === 'Preparando' ? '<button class="primary ok" data-estado="Listo" type="button">'+ico('check',14)+' Listo</button>' : '')
      + (o.estado === 'Listo'      ? '<button class="primary ok" data-estado="Entregado" type="button">'+ico('bag',14)+' Entregado</button>' : '')
      + (o.telefono ? '<a class="wa" href="https://wa.me/'+esc(o.telefono.replace(/\D/g,''))+'?text='+waText+'" target="_blank" rel="noopener">'+ico('message',14)+' WhatsApp</a>' : '')
      + (o.estado !== 'Cancelado' && o.estado !== 'Entregado' ? '<button class="cancel" data-estado="Cancelado" type="button">'+ico('xCircle',14)+'</button>' : '')
    + '</div>'
  + '</article>';
}

document.addEventListener('click', async e => {
  const btn = e.target.closest('[data-estado]');
  if(!btn) return;
  const folio = btn.closest('.order').dataset.folio;
  const nuevoEstado = btn.dataset.estado;
  if(!confirm('¿Cambiar a "'+nuevoEstado+'"?')) return;
  btn.disabled = true;
  try{
    await fetch(CONFIG.sheetUrl, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'updateEstado', folio, estado:nuevoEstado })
    });
    toast('Estado actualizado','checkCircle');
    setTimeout(load, 700);
  }catch(err){ toast('Error al actualizar','xCircle'); btn.disabled = false; }
});

let refreshTimer = null;
async function load(){
  const cont = $('#ordersContainer');
  cont.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Cargando pedidos…</div>';
  try{
    const data = await fetchOrders();
    let rows = data;
    if(rows.length && String(rows[0][0]).toLowerCase().includes('fecha')) rows = rows.slice(1);
    ALL_ORDERS = rows;
    renderOrders();
  }catch(err){
    cont.innerHTML = '<div class="empty" style="grid-column:1/-1">'
      + '<div class="big">'+ico('xCircle',72)+'</div>'
      + '<h3>No se pudieron cargar los pedidos</h3>'
      + '<p style="font-size:13px">Revisa que la URL del Apps Script sea correcta.</p></div>';
  }
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  if($('#autoRefresh').checked){
    refreshTimer = setTimeout(async () => { await load(); scheduleRefresh(); }, CONFIG.autoRefreshMs);
  }
}
$('#refreshBtn').addEventListener('click', load);
$('#autoRefresh').addEventListener('change', scheduleRefresh);
$('#filterEstado').addEventListener('change', renderOrders);
$('#searchInput').addEventListener('input', renderOrders);

function showPanel(){
  $('#loginView').classList.add('hide');
  $('#panelView').classList.remove('hide');
  $('#refreshBtn').innerHTML = ico('refresh',14) + ' Actualizar';
  $('#logoutBtn').innerHTML  = ico('logout',14) + ' Salir';
  load().then(scheduleRefresh);
}

/* Arranque */
if(isAuthed()){
  showPanel();
} else {
  $('#pinInput').focus();
}
</script>
</body>
</html>
